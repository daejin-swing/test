<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기기 로그 및 크래시 리포트 - Fleet Vision</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- Navigation Bar -->
  <nav class="glass sticky top-0 z-50 border-b border-slate-800 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="bg-indigo-600 text-white p-2 rounded-lg shadow-lg shadow-indigo-500/30">
        <i class="fa-solid fa-terminal text-xl"></i>
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-tight text-white">Device Logs & Crashes</h1>
        <p class="text-xs text-slate-400">Realtime Remote Diagnostic Logs</p>
      </div>
    </div>
    <div class="flex items-center space-x-4">
      <a href="/static/index.html" class="px-3 py-2 rounded-md text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800">
        <i class="fa-solid fa-gauge mr-1"></i> 대시보드
      </a>
      <a href="/static/events.html" class="px-3 py-2 rounded-md text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800">
        <i class="fa-solid fa-video mr-1"></i> 전체 이벤트 영상
      </a>
      <a href="/static/logs.html" class="px-3 py-2 rounded-md text-sm font-medium bg-indigo-600/20 text-indigo-400 border border-indigo-500/30">
        <i class="fa-solid fa-terminal mr-1"></i> 시스템 로그
      </a>
    </div>
  </nav>

  <!-- Main Log List -->
  <main class="max-w-7xl mx-auto px-6 py-8">
    
    <!-- Filter Bar -->
    <div class="glass p-4 rounded-2xl mb-6 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <span class="text-xs font-semibold text-slate-400">디바이스 필터:</span>
        <select id="device-select" onchange="onDeviceChange()" class="bg-slate-900 border border-slate-700 text-xs font-medium rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
          <option value="">전체 디바이스 보기</option>
        </select>

        <span class="text-xs font-semibold text-slate-400 ml-2">로그 레벨:</span>
        <select id="level-filter" onchange="fetchLogs()" class="bg-slate-900 border border-slate-700 text-xs font-medium rounded-lg px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
          <option value="">모든 레벨</option>
          <option value="CRITICAL">CRITICAL (크래시)</option>
          <option value="ERROR">ERROR</option>
          <option value="WARNING">WARNING</option>
          <option value="INFO">INFO</option>
        </select>
      </div>

      <div class="flex items-center space-x-3">
        <span id="log-count" class="text-xs text-slate-400 font-mono">0개의 로그</span>
        <button onclick="fetchLogs()" class="px-3 py-2 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700">
          <i class="fa-solid fa-rotate mr-1"></i> 새로고침
        </button>
      </div>
    </div>

    <div id="logs-container" class="space-y-3">
      <!-- Logs will be populated here -->
    </div>
  </main>

  <script>
    // Read ?device_id= from URL
    const urlParams = new URLSearchParams(window.location.search);
    let selectedDeviceId = urlParams.get('device_id') || '';

    async function initDeviceDropdown() {
      try {
        const res = await fetch('/api/v1/devices');
        const devices = await res.json();
        const select = document.getElementById('device-select');
        select.innerHTML = '<option value="">전체 디바이스 보기</option>' + 
          devices.map(d => `<option value="${d.device_id}" ${d.device_id === selectedDeviceId ? 'selected' : ''}>${d.device_id}</option>`).join('');
      } catch (err) {
        console.error(err);
      }
    }

    function onDeviceChange() {
      selectedDeviceId = document.getElementById('device-select').value;
      const newUrl = selectedDeviceId ? `${window.location.pathname}?device_id=${selectedDeviceId}` : window.location.pathname;
      window.history.pushState({}, '', newUrl);
      fetchLogs();
    }

    async function fetchLogs() {
      const level = document.getElementById('level-filter').value;
      let url = '/api/v1/logs?';
      if (selectedDeviceId) url += `device_id=${selectedDeviceId}&`;
      if (level) url += `level=${level}&`;

      try {
        const res = await fetch(url);
        const logs = await res.json();
        renderLogs(logs);
      } catch (err) {
        console.error('Failed to fetch logs:', err);
      }
    }

    function renderLogs(logs) {
      document.getElementById('log-count').innerText = `${logs.length}개의 로그`;
      const container = document.getElementById('logs-container');
      if (logs.length === 0) {
        container.innerHTML = `
          <div class="glass p-12 text-center rounded-2xl">
            <i class="fa-solid fa-circle-check text-4xl text-emerald-500 mb-3"></i>
            <p class="text-slate-400">${selectedDeviceId ? `[${selectedDeviceId}] 기기에` : ''} 조건에 맞는 로그가 없습니다.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = logs.map(l => {
        let badgeColor = 'bg-slate-800 text-slate-300 border-slate-700';
        if (l.level === 'CRITICAL') badgeColor = 'bg-rose-500/20 text-rose-400 border-rose-500/40';
        else if (l.level === 'ERROR') badgeColor = 'bg-red-500/10 text-red-400 border-red-500/30';
        else if (l.level === 'WARNING') badgeColor = 'bg-amber-500/10 text-amber-400 border-amber-500/30';
        else if (l.level === 'INFO') badgeColor = 'bg-blue-500/10 text-blue-400 border-blue-500/30';

        return `
          <div class="glass p-4 rounded-xl border border-slate-800 hover:border-slate-700 transition">
            <div class="flex items-center justify-between mb-2">
              <div class="flex items-center space-x-2">
                <span class="px-2 py-0.5 rounded text-[10px] font-bold border font-mono ${badgeColor}">
                  ${l.level}
                </span>
                <a href="/static/logs.html?device_id=${l.device_id}" class="text-xs font-bold text-indigo-400 hover:underline">${l.device_id}</a>
                <span class="text-xs text-slate-500 font-mono">(${l.module || 'app'})</span>
              </div>
              <span class="text-[11px] text-slate-500 font-mono">${(l.created_at || '').replace('T', ' ').substring(0, 19)}</span>
            </div>

            <p class="text-xs font-mono text-slate-200 mb-2">${l.message}</p>

            ${l.traceback ? `
              <div class="bg-black/50 p-3 rounded-lg border border-red-500/20 mt-2">
                <p class="text-[11px] font-bold text-red-400 mb-1"><i class="fa-solid fa-bug mr-1"></i> Stack Traceback:</p>
                <pre class="text-[11px] font-mono text-red-300/90 whitespace-pre-wrap overflow-x-auto">${l.traceback}</pre>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    initDeviceDropdown();
    fetchLogs();
    setInterval(fetchLogs, 15000);
  </script>
</body>
</html>
